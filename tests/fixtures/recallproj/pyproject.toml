[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recalldemo"
version = "0.1.0"
description = "Tiny project whose decisions feed a Recall bundle."

[project.scripts]
recalldemo = "recalldemo.main:main"

[tool.setuptools.packages.find]
where = ["src"]
